models:
  EntityPosition:
    name: string:100
    description: text nullable

  EngagementType:
    name: string:100
    description: text nullable

  TrainingCenter:
    name: string:200
    code: string:50 nullable unique
    city: string:100 nullable
    department: string:100 nullable

  Person:
    user_id: id unique foreign:users onDelete:cascade
    document_type: enum:cc,ti,passport,foreign_id
    document_number: string:50 unique
    gender: enum:male,female,other nullable
    phone: string:20 nullable
    mobile: string:20 nullable
    entity_position_id: id nullable foreign:entity_positions onDelete:null
    engagement_type_id: id nullable foreign:engagement_types onDelete:null
    training_center_id: id nullable foreign:training_centers onDelete:null
    status: enum:active,inactive,suspended default:active
    indexes:
      - index: status

  ResearchGroup:
    group_code: string:50 unique
    name: string:200
    description: text nullable
    logo_path: string:255 nullable
    director_id: id foreign:users
    training_center_id: id nullable foreign:training_centers onDelete:null
    status: enum:active,inactive,under_review default:active
    founded_on: date nullable

  ResearchGroupMember:
    research_group_id: id foreign:research_groups onDelete:cascade
    researcher_id: id foreign:users
    joined_on: date
    left_on: date nullable
    status: enum:active,inactive default:active
    notes: text nullable
    indexes:
      - unique: research_group_id,researcher_id

  MincienciasTypology:
    name: string:200
    description: text nullable
    code: string:50 nullable unique

  ProductType:
    name: string:200
    category: string:100 nullable
    description: text nullable

  ResearchProduct:
    investigator_id: id foreign:users
    research_group_id: id foreign:research_groups
    project_origin_type: enum:sgps,installed_capacity,formative_research,center_initiative,allied_entity_articulation
    origin_project_code: string:100 nullable
    minciencias_typology_id: id nullable foreign:minciencias_typologies onDelete:null
    product_type_id: id nullable foreign:product_types onDelete:null
    name: string:300
    description: text nullable
    publication_year: year nullable
    training_program_name: string:200 nullable
    has_repository: boolean default:false
    repository_url: string:500 nullable
    review_status: enum:draft,submitted,in_review,approved,rejected default:draft
    submitted_at: dateTime nullable
    reviewed_at: dateTime nullable
    indexes:
      - index: review_status
      - index: publication_year

  ResearchProductAuthor:
    research_product_id: id foreign:research_products onDelete:cascade
    name: string:200
    email: string:150 nullable
    mobile: string:20 nullable
    author_order: integer
    indexes:
      - unique: research_product_id,author_order

  ResearchProductEvidence:
    meta:
      table: research_product_evidences
    research_product_id: id foreign:research_products onDelete:cascade
    file_path: string:500
    file_type: string:50 nullable
    file_size: integer nullable

  ResearchProductDataAuthorization:
    research_product_id: id unique foreign:research_products onDelete:cascade
    authorized: boolean
    authorized_at: dateTime
    notes: text nullable

  ResearchProductReview:
    research_product_id: id foreign:research_products onDelete:cascade
    director_id: id foreign:users
    decision: enum:approved,rejected,requires_changes
    notes: text nullable
    reviewed_at: dateTime

  ResearchGroupMinute:
    research_group_id: id foreign:research_groups onDelete:cascade
    research_product_id: id nullable foreign:research_products onDelete:null
    file_path: string:500
    description: text nullable
    minute_date: date
    minute_type: string:100 nullable

  ResearchProductReport:
    research_group_id: id foreign:research_groups
    research_product_id: id foreign:research_products
    file_path: string:500
    report_type: string:100 nullable
    description: text nullable
    report_date: date

  Seedbed:
    name: string:200
    seedbed_code: string:50 nullable unique
    logo_path: string:255 nullable
    description: text nullable
    director_id: id nullable foreign:users onDelete:null
    training_center_id: id nullable foreign:training_centers onDelete:null
    status: enum:active,inactive,under_review default:active
    founded_on: date nullable

  Minute:
    seedbed_id: id foreign:seedbeds onDelete:cascade
    document_name: string:200 nullable
    file_path: string:500
    description: text nullable
    document_date: date nullable

  Form:
    seedbed_id: id foreign:seedbeds onDelete:cascade
    document_name: string:200 nullable
    file_path: string:500
    description: text nullable
    document_date: date nullable

  Record:
    seedbed_id: id foreign:seedbeds onDelete:cascade
    document_name: string:200 nullable
    file_path: string:500
    description: text nullable
    document_date: date nullable

  EndorsementLetter:
    seedbed_id: id foreign:seedbeds onDelete:cascade
    document_name: string:200 nullable
    file_path: string:500
    description: text nullable
    document_date: date nullable

  GroupFormat:
    seedbed_id: id foreign:seedbeds onDelete:cascade
    document_name: string:200 nullable
    file_path: string:500
    description: text nullable
    document_date: date nullable

  SeedbedMember:
    seedbed_id: id foreign:seedbeds onDelete:cascade
    user_id: id foreign:users
    seedbed_role: enum:leader,advisor,collaborator
    joined_on: date
    left_on: date nullable
    status: enum:active,inactive default:active
    indexes:
      - unique: seedbed_id,user_id

  ResearchLine:
    name: string:200
    description: text nullable

  TechnologyLine:
    name: string:200
    description: text nullable

  ThematicArea:
    name: string:100
    description: text nullable

  ProjectModality:
    name: string:100
    description: text nullable

  ResearchType:
    name: string:100
    description: text nullable

  SeedbedProject:
    name: string:300
    description: text nullable
    seedbed_id: id foreign:seedbeds
    advisor_id: id foreign:users
    research_line_id: id nullable foreign:research_lines onDelete:null
    technology_line_id: id nullable foreign:technology_lines onDelete:null
    thematic_area_id: id nullable foreign:thematic_areas onDelete:null
    project_modality_id: id nullable foreign:project_modalities onDelete:null
    research_type_id: id nullable foreign:research_types onDelete:null
    start_date: date nullable
    end_date: date nullable
    status: enum:proposal,in_development,finished,on_hold,canceled default:proposal
    linked_to_macro_project: boolean default:false
    macro_project_code: string:100 nullable
    macro_project_name: string:300 nullable

  TrainingProgram:
    name: string:200
    program_code: string:50 nullable unique
    program_type: enum:technologist,technician,complementary,specialization,other
    other_program_type: string:100 nullable
    training_center_id: id nullable foreign:training_centers onDelete:null
    status: enum:active,inactive default:active

  TrainingCohort:
    cohort_number: string:50 unique
    training_program_id: id foreign:training_programs
    start_date: date
    end_date: date
    shift: string:50 nullable
    status: enum:active,finished,canceled default:active

  Apprentice:
    user_id: id nullable foreign:users onDelete:null
    full_name: string:200
    document_type: enum:cc,ti,foreign_id
    document_number: string:50 unique
    gender: enum:male,female,other nullable
    birth_date: date nullable
    phone: string:20 nullable
    mobile: string:20 nullable
    email: string:150 nullable
    blood_type: string:10 nullable
    health_provider: string:100 nullable
    training_cohort_id: id foreign:training_cohorts
    support_type: string:200 nullable
    seedbed_id: id nullable foreign:seedbeds onDelete:null
    seedbed_project_id: id nullable foreign:seedbed_projects onDelete:null
    project_file_path: string:500 nullable
    status: enum:active,inactive,graduated,withdrawn default:active
    admission_date: date nullable
    withdrawal_date: date nullable

  SeedbedMemberReport:
    seedbed_id: id foreign:seedbeds
    apprentice_id: id nullable foreign:apprentices onDelete:null
    advisor_id: id nullable foreign:users onDelete:null
    member_type: enum:apprentice,advisor,collaborator
    period: string:50 nullable
    notes: text nullable
    report_date: date

  SeedbedProgressReport:
    seedbed_id: id foreign:seedbeds
    leader_id: id foreign:users
    seedbed_project_id: id nullable foreign:seedbed_projects onDelete:null
    report_date: date
    reported_period: string:50 nullable
    progress_percentage: decimal:5,2 nullable
    notes: text nullable
    recommendations: text nullable
    status: enum:draft,submitted,reviewed,approved default:draft

  ProjectEvidence:
    meta:
      table: project_evidences
    seedbed_project_id: id foreign:seedbed_projects onDelete:cascade
    user_id: id foreign:users
    evidence_name: string:200 nullable
    file_path: string:500
    file_type: enum:pdf,excel,word,image,video,other
    description: text nullable

  SeedbedProduct:
    seedbed_project_id: id foreign:seedbed_projects onDelete:cascade
    name: string:300
    product_type: enum:article,presentation,prototype,software,certificate,patent,registration,other
    description: text nullable
    file_path: string:500 nullable
    obtained_on: date nullable
    status: enum:in_progress,completed,published default:in_progress
